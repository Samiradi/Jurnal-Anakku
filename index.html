<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<style>
:root{--bg:#fdf6ef;--card:#fffdf9;--ink:#4a3b32;--muted:#8a7a6e;--accent:#d98b5f;--accent2:#8fb8a0;--line:#eadfd3;--gold:#f2c46d}
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,"Times New Roman",serif;background:linear-gradient(180deg,#fdf6ef,#f5e9dc);color:var(--ink);min-height:100vh;line-height:1.5}
.app{max-width:640px;margin:0 auto;padding:16px 14px 80px;position:relative;z-index:1}
h1{font-size:1.5rem;margin:.2rem 0 .4rem}
h2{font-size:1.2rem;margin:.2rem 0 .6rem}
h3{font-size:1rem;margin:.8rem 0 .4rem}
.muted{color:var(--muted);font-size:.92rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 4px 14px rgba(120,80,50,.06)}
.hero{text-align:center;padding:26px 18px;background:linear-gradient(135deg,#fff8f0,#f7ecdf)}
.hero .sapa{font-size:1.35rem}
.quote{font-style:italic;color:var(--muted);margin-top:10px}
.memory{border-left:4px solid var(--gold)}
.memory img{width:100%;border-radius:12px;margin:10px 0}
input,textarea,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff;color:var(--ink);margin:4px 0 10px}
textarea{min-height:100px;resize:vertical}
label{display:block;font-size:.92rem;color:var(--muted)}
label.check{display:flex;align-items:center;gap:8px;color:var(--ink);margin:8px 0}
label.check input{width:auto;margin:0}
button{font:inherit;border:none;border-radius:12px;padding:11px 16px;cursor:pointer;min-height:44px}
.primary{background:var(--accent);color:#fff;width:100%;margin-top:4px}
.ghost{background:#f3e7da;color:var(--ink);margin:4px 4px 4px 0}
.x{background:none;color:var(--muted);padding:2px 6px;min-height:auto;font-size:.85rem}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.childRow{display:grid;grid-template-columns:1fr 1fr;gap:6px;align-items:center;margin-bottom:8px}
.childRow .x{grid-column:span 2;justify-self:end}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kid{cursor:pointer;text-align:center}
.kid:active{transform:scale(.98)}
.avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--accent2),#b9d7c4);color:#fff;font-size:1.6rem;display:flex;align-items:center;justify-content:center;margin:0 auto 8px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:10px 0 14px;padding-bottom:4px}
.tab{background:#f3e7da;color:var(--ink);white-space:nowrap;padding:8px 14px;min-height:auto}
.tab.on{background:var(--accent);color:#fff}
.entry{border-bottom:1px dashed var(--line);padding:12px 0}
.entry:last-child{border-bottom:none}
.entry.letter{background:#fbf3e6;border-radius:14px;padding:14px;border:1px solid #efdcc4}
.entry .meta{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted)}
.entry p{white-space:pre-wrap;margin:6px 0}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;margin:8px 0}
.pgrid img,.gallery img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;cursor:pointer;background:#f3e7da}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gallery .cap{font-size:.75rem;color:var(--muted);margin:2px 0 8px}
#fotoPrev{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px;margin:6px 0}
#fotoPrev img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px}
.mslot{background:#fffaf4;border:1px dashed var(--line);border-radius:12px;padding:8px;text-align:center}
.mslot img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;cursor:pointer}
.mhead{font-weight:bold;color:var(--accent);margin-bottom:6px}
.mempty{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;color:var(--muted);border-radius:10px;background:#f7efe6;cursor:pointer;font-size:.9rem;text-align:center;padding:6px}
.mempty input{display:none}
.mdate{font-size:.8rem;padding:6px 8px;margin:6px 0;min-height:auto}
.group{margin-bottom:12px}
.badge{display:inline-block;background:#e4f1e8;color:#3f7a57;border-radius:20px;padding:2px 10px;font-size:.78rem;margin-left:6px}
.chart{width:100%;height:auto;background:#fffaf4;border-radius:12px;margin:6px 0}
table{width:100%;border-collapse:collapse;font-size:.92rem}
td,th{padding:6px;border-bottom:1px solid var(--line);text-align:left}
.year{font-size:1.1rem;color:var(--accent);margin:18px 0 6px;border-bottom:1px solid var(--line)}
.tl{font-size:.92rem;padding:6px 0 6px 12px;border-left:2px solid var(--line);margin-left:6px}
.kk-scroll{max-height:420px;overflow-y:auto;padding:0 8px 0 2px;overscroll-behavior:contain;scrollbar-width:thin}
.kk-scroll .year{position:sticky;top:0;background:var(--card);z-index:1;padding-top:6px}
@media (min-width:900px){.kk-scroll{max-height:520px}}
.tgl{font-weight:bold;color:var(--accent);font-size:.9rem}
.bar{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.back{background:none;color:var(--accent);padding:4px 0;min-height:auto}
.drive{font-size:.92rem}
.drive .ok{color:#3f7a57}
.drive .wait{color:#a2762e}
.lb{position:fixed;inset:0;background:rgba(30,20,15,.92);display:flex;align-items:center;justify-content:center;z-index:50}
.lb img{max-width:96vw;max-height:80vh;border-radius:10px}
.lb .nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.15);color:#fff;font-size:1.6rem;padding:8px 14px}
.lb .prev{left:8px}.lb .next{right:8px}
.lb .close{position:absolute;top:10px;right:10px;transform:none;font-size:1.1rem}
.lb .info{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#f7ecdf;font-size:.9rem;padding:0 16px}
/* ---------- MODE TERANG: DAUN BERTERBANGAN & BUKIT ---------- */
.scene{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
body.dark .scene{display:none}
body:not(.dark) .card{background:rgba(255,253,249,.88);backdrop-filter:blur(3px)}
.leaf{position:absolute;top:-8%;border-radius:0 70% 0 70%;opacity:.85;animation:fall var(--d) linear infinite;animation-delay:var(--dl)}
@keyframes fall{
  0%{transform:translate(0,0) rotate(0deg)}
  50%{transform:translate(60px,55vh) rotate(180deg)}
  100%{transform:translate(-40px,112vh) rotate(360deg)}
}
.hills{position:absolute;left:0;bottom:0;width:100%;height:42vh}
.blade{transform-box:fill-box;transform-origin:50% 100%;animation:sway var(--s,4s) ease-in-out infinite alternate;animation-delay:var(--sl,0s)}
@keyframes sway{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
@media (prefers-reduced-motion:reduce){.leaf,.blade{animation:none}}

/* ---------- MODE GELAP & TATA SURYA ---------- */
.space{display:none;position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
body.dark{color:var(--ink);background:radial-gradient(ellipse at top,#1b1f4a 0%,#0a0c22 60%,#05060f 100%);background-attachment:fixed;--ink:#eef0ff;--muted:#a9afd6;--card:rgba(22,24,58,.78);--line:#2e3366;--accent:#f0a875;--accent2:#7fd1b9;--gold:#ffd77a;transition:background .6s}
body.dark .space{display:block}
body.dark .card{backdrop-filter:blur(6px);box-shadow:0 0 24px rgba(120,140,255,.12)}
body.dark .hero{background:linear-gradient(135deg,rgba(40,44,100,.85),rgba(20,22,60,.85))}
body.dark input,body.dark textarea,body.dark select{background:#12143a;color:var(--ink);border-color:var(--line)}
body.dark .ghost,body.dark .tab{background:#23285e;color:var(--ink)}
body.dark .primary{background:linear-gradient(135deg,#e88d5c,#c96f9b)}
body.dark .entry.letter{background:rgba(70,58,20,.35);border-color:#5a4a20}
body.dark .mslot{background:rgba(20,22,60,.6)}
body.dark .mempty{background:#1a1d48}
body.dark .chart{background:rgba(20,22,60,.6)}
body.dark .gallery img,body.dark .pgrid img,body.dark .mslot img{background:#1a1d48}
body.dark .badge{background:#1f4a3a;color:#bff5dc}
body.dark .drive .ok{color:#7fd1b9}
body.dark .drive .wait{color:var(--gold)}
body.dark .year,body.dark .mhead,body.dark .back{color:var(--gold)}
body.dark .memory{border-left-color:var(--gold)}
body.dark .tl{border-color:var(--line)}
body.dark td,body.dark th{border-color:var(--line)}
body.dark .lb{background:rgba(3,4,14,.95)}
.star{position:absolute;border-radius:50%;background:#fff;animation:twinkle var(--d,3s) ease-in-out infinite;animation-delay:var(--dl,0s);box-shadow:0 0 4px rgba(255,255,255,.7)}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:1;transform:scale(1.25)}}
.sys{position:absolute;top:120px;right:12%;width:0;height:0;opacity:.6}
.sun{position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6c4,#ffc857 55%,#ff9f43);box-shadow:0 0 40px rgba(255,190,80,.7)}
.orbit{position:absolute;left:0;top:0;width:var(--r);height:var(--r);margin-left:calc(var(--r)/-2);margin-top:calc(var(--r)/-2);border-radius:50%;border:1px dashed rgba(200,210,255,.14);animation:spin var(--t) linear infinite}
.planet{position:absolute;left:50%;top:0;width:var(--ps);height:var(--ps);margin-left:calc(var(--ps)/-2);margin-top:calc(var(--ps)/-2);border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.star,.orbit{animation:none}}
@media print{.noprint{display:none!important}body{background:#fff}.card{box-shadow:none}}
@media (max-width:420px){.grid{grid-template-columns:1fr}.gallery{grid-template-columns:repeat(2,1fr)}}
/* ---------- TAMPILAN DESKTOP ---------- */
.home,.split{display:block}
@media (min-width:900px){
  .app{max-width:1180px;padding:28px 32px 80px}
  body{font-size:17px}
  h1{font-size:2rem}
  .card{padding:24px}
  .hero{padding:36px 28px}
  .hero .sapa{font-size:1.6rem}
  .home{display:grid;grid-template-columns:minmax(320px,400px) 1fr;gap:0 26px;align-items:start}
  .home>.hero,.home>.bar{grid-column:1/-1}
  .col-a{position:sticky;top:20px}
  .col-a,.col-b{min-width:0}
  .grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
  .gallery{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  .pgrid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  .tabs{flex-wrap:wrap;overflow:visible}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:0 26px;align-items:start}
  .split>:not(.card){grid-column:1/-1}
  textarea{min-height:150px}
  .childRow{grid-template-columns:2fr 1.2fr 1.5fr auto}
  .childRow .x{grid-column:auto;justify-self:auto}
  .lb img{max-width:80vw;max-height:82vh}
}
</style>

<body>
<div class="space" id="space" aria-hidden="true"></div>
<div class="scene" id="scene" aria-hidden="true"></div>
<div class="app" id="app"><p class="muted" style="text-align:center;margin-top:40px">Memuat...</p></div>
<input type="file" accept="application/json" id="importFile" style="display:none">

<script>
const KEY='jurnal-tumbuh-kembang-v1';
const DRIVE_KEY='jurnal-drive-v1';
const DRIVE_ON_KEY='jurnal-drive-on';
const DB_NAME='jurnal-anak';
const STORE='foto';
const MAX_PHOTOS=8;
const CLIENT_ID='394889107563-j3cajoh1thpcffo1f3g7anv7g3f2oqqe.apps.googleusercontent.com';
const DRIVE_SCOPE='https://www.googleapis.com/auth/drive.file';
const FOLDER_NAME='Jurnal Anak';
const BACKUP_NAME='jurnal-anak-cadangan.json';
const QUOTES=[
 'Setiap hari bersama mereka adalah bab kecil yang tidak ingin kami lupakan.',
 'Tumbuhlah pelan-pelan, Nak. Kami akan selalu menjadi saksi langkahmu.',
 'Jejak kecil hari ini adalah kenangan besar di kemudian hari.',
 'Tidak ada yang lebih indah dari tawa mereka yang menyambut setiap pagi.',
 'Kelak mungkin mereka lupa apa yang kita ucapkan, tapi tidak akan lupa betapa kita mencintai mereka.',
 'Waktu berjalan cepat, maka simpanlah setiap momen yang bisa disimpan.'
];
const MILESTONES=[
 {from:0,to:3,label:'0–3 bulan',items:['Mengangkat kepala saat tengkurap','Tersenyum saat diajak bicara','Mengikuti benda dengan matanya','Menoleh ke arah suara']},
 {from:3,to:6,label:'3–6 bulan',items:['Tertawa keras','Berguling','Meraih mainan','Mengoceh (ba-ba, ma-ma)']},
 {from:6,to:12,label:'6–12 bulan',items:['Duduk tanpa bantuan','Merangkak','Berdiri berpegangan','Mengucapkan kata pertama','Menunjuk benda']},
 {from:12,to:24,label:'12–24 bulan',items:['Berjalan tanpa bantuan','Mengucapkan 5+ kata','Menyusun 2–3 balok','Menunjuk bagian tubuh']},
 {from:24,to:36,label:'2–3 tahun',items:['Berlari','Naik tangga sambil berpegangan','Menyebut nama sendiri','Menggambar garis']},
 {from:36,to:60,label:'3–5 tahun',items:['Melompat dengan dua kaki','Menyebut warna','Bercerita 3–4 kalimat','Memakai baju sendiri']}
];

/* ---------- UTILITAS ---------- */
const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const pad=n=>String(n).padStart(2,'0');
const toISO=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const birthDate=c=>new Date(c.birth+'T00:00:00');
const fmtDate=s=>new Date(s+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
function monthsBetween(b,on){let m=(on.getFullYear()-b.getFullYear())*12+(on.getMonth()-b.getMonth());if(on.getDate()<b.getDate())m--;return m;}
function ageMonths(c){return monthsBetween(birthDate(c),new Date());}
function ageText(c){
  const b=birthDate(c),now=new Date();
  const m=monthsBetween(b,now);
  if(m<0)return 'belum lahir';
  if(m<1)return Math.floor((now-b)/86400000)+' hari';
  const y=Math.floor(m/12),r=m%12;
  return ((y?y+' tahun':'')+(y&&r?' ':'')+(r?r+' bulan':'')).trim();
}
function greet(){const h=new Date().getHours();return h<11?'Selamat pagi':h<15?'Selamat siang':h<18?'Selamat sore':'Selamat malam';}

/* ---------- DATA: teks di localStorage, foto di IndexedDB ---------- */
let S=emptyState();
let DB=null;
const PHOTO={};
let DRIVE={folderId:null,files:{},pending:[]}; // files: id foto -> id file di Drive

function emptyState(){return {parent:{ayah:'',ibu:''},role:'ibu',children:[],entries:[],milestones:{},growth:[],monthly:{}};}
function normalize(s){
  s=Object.assign(emptyState(),s);
  s.entries=s.entries.map(e=>{
    if(!e.photos)e.photos=e.photo?[e.photo]:[];
    delete e.photo;return e;
  });
  return s;
}
function loadState(){
  try{const d=JSON.parse(localStorage.getItem(KEY));return d?normalize(d):emptyState();}
  catch(e){return emptyState();}
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));scheduleBackup();}
  catch(e){alert('Penyimpanan browser penuh. Unduh cadangan untuk berjaga-jaga.');}
}
function loadDrive(){
  try{const d=JSON.parse(localStorage.getItem(DRIVE_KEY));if(d)DRIVE=Object.assign({folderId:null,files:{},pending:[]},d);}catch(e){}
}
function saveDrive(){localStorage.setItem(DRIVE_KEY,JSON.stringify(DRIVE));}

function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,1);
    r.onupgradeneeded=()=>r.result.createObjectStore(STORE);
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
  });
}
function idbWrite(fn){
  return new Promise((res,rej)=>{
    const tx=DB.transaction(STORE,'readwrite');
    fn(tx.objectStore(STORE));
    tx.oncomplete=()=>res();
    tx.onerror=()=>rej(tx.error);
  });
}
function idbAll(){
  return new Promise((res,rej)=>{
    const out={};
    const tx=DB.transaction(STORE,'readonly');
    const req=tx.objectStore(STORE).openCursor();
    req.onsuccess=()=>{const c=req.result;if(c){out[c.key]=c.value;c.continue();}};
    tx.oncomplete=()=>res(out);
    tx.onerror=()=>rej(tx.error);
  });
}
async function addPhoto(dataUrl){
  const id='p'+uid();
  PHOTO[id]=dataUrl;
  await idbWrite(st=>st.put(dataUrl,id));
  queueUpload(id);
  return id;
}
async function removePhotos(ids){
  ids=ids.filter(Boolean);
  if(!ids.length)return;
  ids.forEach(id=>{delete PHOTO[id];DRIVE.pending=DRIVE.pending.filter(x=>x!==id);});
  saveDrive();
  await idbWrite(st=>ids.forEach(id=>st.delete(id)));
}
const src=id=>PHOTO[id]||'';

// Memindahkan foto lama (dataURL di localStorage) ke IndexedDB
async function migrate(){
  let changed=false;
  for(const e of S.entries){
    for(let i=0;i<e.photos.length;i++){
      if(e.photos[i].startsWith('data:')){e.photos[i]=await addPhoto(e.photos[i]);changed=true;}
    }
  }
  for(const cid in S.monthly){
    for(const m in S.monthly[cid]){
      const p=S.monthly[cid][m];
      if(p.photo&&p.photo.startsWith('data:')){p.photo=await addPhoto(p.photo);changed=true;}
    }
  }
  if(changed)save();
}
function allPhotoIds(){
  const ids=[];
  S.entries.forEach(e=>ids.push(...e.photos));
  Object.values(S.monthly).forEach(bulan=>Object.values(bulan).forEach(p=>ids.push(p.photo)));
  return ids;
}

/* ---------- GOOGLE DRIVE ---------- */
let tokenClient=null,token=null,tokenExp=0,uploading=false;

function waitGoogle(){
  return new Promise(res=>{
    const t=setInterval(()=>{if(window.google&&google.accounts&&google.accounts.oauth2){clearInterval(t);res(true);}},200);
    setTimeout(()=>{clearInterval(t);res(false);},8000);
  });
}
function initDriveClient(){
  tokenClient=google.accounts.oauth2.initTokenClient({
    client_id:CLIENT_ID,
    scope:DRIVE_SCOPE,
    callback:resp=>{
      if(resp.error){alert('Gagal terhubung ke Google Drive: '+resp.error);updateDriveBar();return;}
      token=resp.access_token;
      tokenExp=Date.now()+(resp.expires_in-60)*1000;
      localStorage.setItem(DRIVE_ON_KEY,'1');
      updateDriveBar();
      processQueue();
      scheduleBackup();
    },
    error_callback:()=>{updateDriveBar();}
  });
}
function connectDrive(){
  if(!tokenClient)return alert('Layanan Google belum siap. Pastikan koneksi internet aktif lalu muat ulang halaman.');
  tokenClient.requestAccessToken({prompt:localStorage.getItem(DRIVE_ON_KEY)?'':'consent'});
}
function silentConnect(){
  if(!tokenClient||!localStorage.getItem(DRIVE_ON_KEY))return;
  try{tokenClient.requestAccessToken({prompt:'none'});}catch(e){}
}
function driveConnected(){return !!token&&Date.now()<tokenExp;}

async function apiFetch(url,opts={}){
  if(!driveConnected())throw new Error('TOKEN');
  const r=await fetch(url,{...opts,headers:{...(opts.headers||{}),Authorization:'Bearer '+token}});
  if(r.status===401){token=null;throw new Error('TOKEN');}
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r;
}
async function findOrCreateFolder(){
  if(DRIVE.folderId)return DRIVE.folderId;
  const q=encodeURIComponent(`name='${FOLDER_NAME}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const found=await (await apiFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)`)).json();
  if(found.files&&found.files.length){DRIVE.folderId=found.files[0].id;}
  else{
    const created=await (await apiFetch('https://www.googleapis.com/drive/v3/files?fields=id',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name:FOLDER_NAME,mimeType:'application/vnd.google-apps.folder'})
    })).json();
    DRIVE.folderId=created.id;
  }
  saveDrive();
  return DRIVE.folderId;
}
async function uploadPhoto(id){
  const folderId=await findOrCreateFolder();
  const blob=await (await fetch(PHOTO[id])).blob();
  const boundary='jurnal'+uid();
  const meta={name:id+'.jpg',parents:[folderId]};
  const body=new Blob([
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${boundary}\r\nContent-Type: image/jpeg\r\n\r\n`,
    blob,
    `\r\n--${boundary}--`
  ]);
  const r=await apiFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{
    method:'POST',headers:{'Content-Type':'multipart/related; boundary='+boundary},body
  });
  const j=await r.json();
  DRIVE.files[id]=j.id;
}
async function processQueue(){
  if(uploading||!driveConnected()||!navigator.onLine)return updateDriveBar();
  uploading=true;
  try{
    while(DRIVE.pending.length){
      const id=DRIVE.pending[0];
      if(!PHOTO[id]||DRIVE.files[id]){DRIVE.pending.shift();saveDrive();continue;}
      await uploadPhoto(id);
      DRIVE.pending.shift();saveDrive();
      updateDriveBar();
    }
  }catch(e){
    // gagal: akan dicoba lagi otomatis
  }finally{
    uploading=false;
    updateDriveBar();
  }
}
function queueUpload(id){
  if(DRIVE.files[id]||DRIVE.pending.includes(id))return;
  DRIVE.pending.push(id);saveDrive();
  processQueue();
}
// Mengambil foto yang hilang di perangkat dari Drive (berguna saat pindah perangkat)
async function restoreFromDrive(){
  if(!driveConnected())return alert('Hubungkan Google Drive terlebih dahulu.');
  try{
    const folderId=await findOrCreateFolder();
    const bid=await findBackupId(folderId);
    if(bid){
      const data=await (await apiFetch(`https://www.googleapis.com/drive/v3/files/${bid}?alt=media`)).json();
      const waktu=data.savedAt?new Date(data.savedAt).toLocaleString('id-ID'):'';
      if(data.state&&confirm('Ditemukan cadangan teks di Drive'+(waktu?' (disimpan '+waktu+')':'')+'. Pulihkan teks kenangan dari cadangan ini?')){
        S=normalize(data.state);
        save();
      }
    }
    const list=await (await apiFetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(`'${folderId}' in parents and trashed=false`)}&fields=files(id,name)&pageSize=1000`)).json();
    const byName={};
    (list.files||[]).forEach(f=>byName[f.name.replace(/\.jpg$/,'')]=f.id);
    let n=0;
    for(const id of allPhotoIds()){
      if(PHOTO[id]||!byName[id])continue;
      const blob=await (await apiFetch(`https://www.googleapis.com/drive/v3/files/${byName[id]}?alt=media`)).blob();
      const dataUrl=await new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(blob);});
      PHOTO[id]=dataUrl;DRIVE.files[id]=byName[id];
      await idbWrite(st=>st.put(dataUrl,id));
      n++;
    }
    saveDrive();
    alert(n?`${n} foto berhasil dipulihkan dari Google Drive.`:'Tidak ada foto yang perlu dipulihkan.');
    render();
  }catch(e){alert('Gagal memulihkan dari Drive. Coba hubungkan ulang.');}
}
function driveStatus(id){
  if(DRIVE.files[id])return '<span class="ok">☁️ tersimpan di Drive</span>';
  if(DRIVE.pending.includes(id))return '<span class="wait">⏳ menunggu unggah</span>';
  return '';
}
function driveBarHtml(){
  const up=Object.keys(DRIVE.files).length;
  const wait=DRIVE.pending.length;
  if(!driveConnected()){
    return `<div class="drive"><strong>Google Drive belum terhubung.</strong>
      <div class="muted">Foto tetap tersimpan di perangkat. Hubungkan untuk menyimpan salinan ke Drive.</div>

}

/* ---------- CADANGAN OTOMATIS KE DRIVE ---------- */
let backupTimer=null,backingUp=false;
let lastBackup=localStorage.getItem('jurnal-backup-time')||'';
function scheduleBackup(){
  if(!driveConnected())return;
  clearTimeout(backupTimer);
  backupTimer=setTimeout(backupToDrive,4000);
}
async function findBackupId(folderId){
  const q=encodeURIComponent(`name='${BACKUP_NAME}' and '${folderId}' in parents and trashed=false`);
  const j=await (await apiFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)`)).json();
  return j.files&&j.files.length?j.files[0].id:null;
}
// Cadangan berisi teks dan daftar foto (bukan isi fotonya, karena foto sudah ada di Drive)
async function backupToDrive(){
  if(backingUp||!driveConnected()||!navigator.onLine)return;
  backingUp=true;
  try{
    const folderId=await findOrCreateFolder();
    const body=JSON.stringify({app:'jurnal-anak',version:3,savedAt:new Date().toISOString(),state:S,drive:{folderId:DRIVE.folderId,files:DRIVE.files}});
    const existingId=await findBackupId(folderId);
    if(existingId){
      await apiFetch(`https://www.googleapis.com/upload/drive/v3/files/${existingId}?uploadType=media`,{
        method:'PATCH',headers:{'Content-Type':'application/json'},body
      });
    }else{
      const boundary='jurnal'+uid();
      const meta={name:BACKUP_NAME,parents:[folderId]};
      const multipart=new Blob([
        `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n`,
        body,
        `\r\n--${boundary}--`
      ]);
      await apiFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{
        method:'POST',headers:{'Content-Type':'multipart/related; boundary='+boundary},body:multipart
      });
    }
    lastBackup=new Date().toLocaleString('id-ID');
    localStorage.setItem('jurnal-backup-time',lastBackup);
  }catch(e){
    // gagal: akan dicoba lagi saat ada perubahan berikutnya
  }finally{
    backingUp=false;
    updateDriveBar();
  }
}

async function saveSetup(){
  syncDraftTop();
  const d=ui.draft;
  if(!d.ayah.trim()&&!d.ibu.trim())return alert('Isi nama ayah atau ibu.');
  const kids=d.children.filter(c=>c.name.trim());
  if(!kids.length)return alert('Tambahkan minimal satu anak.');
  if(kids.some(c=>!c.birth))return alert('Isi tanggal lahir setiap anak.');
  const newKids=kids.map(c=>({id:c.id||uid(),name:c.name.trim(),gender:c.gender||'-',birth:c.birth}));
  const removed=S.children.filter(c=>!newKids.find(n=>n.id===c.id));
  if(removed.length&&!confirm('Anak yang dihapus dari daftar akan kehilangan catatan dan fotonya di perangkat ini (salinan di Drive tetap ada). Lanjutkan?'))return;
  for(const r of removed){
    const photoIds=[];
    S.entries.filter(e=>e.childId===r.id).forEach(e=>photoIds.push(...e.photos));
    Object.values(S.monthly[r.id]||{}).forEach(p=>photoIds.push(p.photo));
    await removePhotos(photoIds);
    S.entries=S.entries.filter(e=>e.childId!==r.id);
    S.growth=S.growth.filter(g=>g.childId!==r.id);
    delete S.milestones[r.id];
    delete S.monthly[r.id];
  }
  S.parent={ayah:d.ayah.trim(),ibu:d.ibu.trim()};
  S.role=d.role;
  S.children=newKids;
  save();go('home');
}

function pickMemory(){
  const now=new Date(),mmdd=toISO(now).slice(5),yyyy=now.getFullYear();
  const past=S.entries.filter(e=>e.date.slice(5)===mmdd&&+e.date.slice(0,4)<yyyy);
  if(past.length){const e=pick(past);return {e,title:(yyyy-+e.date.slice(0,4))+' tahun yang lalu hari ini'};}
  const withPhoto=S.entries.filter(e=>e.photos.length);
  if(withPhoto.length){const e=pick(withPhoto);return {e,title:'Kenangan dari '+fmtDate(e.date)};}
  if(S.entries.length){const e=pick(S.entries);return {e,title:'Kenangan dari '+fmtDate(e.date)};}
  return null;
}

async function exportData(){
  const photos=await idbAll();
  const blob=new Blob([JSON.stringify({app:'jurnal-anak',version:3,state:S,drive:DRIVE,photos})],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='jurnal-anak-'+toISO(new Date())+'.json';a.click();
}
async function importData(file){
  if(!file)return;
  let d;
  try{d=JSON.parse(await file.text());}catch(e){return alert('File cadangan tidak valid.');}
  if(!confirm('Pulihkan cadangan akan menggantikan semua data di perangkat ini. Lanjutkan?'))return;
  const isNew=d&&d.state&&(d.version===2||d.version===3);
  const newState=normalize(isNew?d.state:d);
  await idbWrite(st=>st.clear());
  for(const k of Object.keys(PHOTO))delete PHOTO[k];
  if(isNew){
    for(const [id,data] of Object.entries(d.photos||{})){
      PHOTO[id]=data;
      await idbWrite(st=>st.put(data,id));
    }
    if(d.drive){DRIVE=Object.assign({folderId:null,files:{},pending:[]},d.drive);}
  }
  S=newState;
  await migrate();
  saveDrive();save();go('home');
}

  ui.pendingPhotos=[];save();render();
}

document.addEventListener('change',e=>{
  if(e.target.id==='fotoInput')readPhotos(e.target.files);
  if(e.target.id==='importFile')importData(e.target.files[0]);
  if(e.target.dataset&&e.target.dataset.monthly){
    const [cid,m]=e.target.dataset.monthly.split('|');
    const dEl=document.getElementById('md_'+cid+'_'+m);
    uploadMonthly(cid,+m,e.target.files[0],dEl?dEl.value:null);
  }
});
function compress(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=reject;
    reader.onload=()=>{
      const img=new Image();
      img.onerror=reject;
      img.onload=()=>{
        const max=1000,scale=Math.min(1,max/Math.max(img.width,img.height));
        const cv=document.createElement('canvas');
        cv.width=Math.round(img.width*scale);cv.height=Math.round(img.height*scale);
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        resolve(cv.toDataURL('image/jpeg',0.75));
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}
async function readPhotos(files){
  const list=[...files].filter(f=>f.type.startsWith('image/'));
  for(const f of list){
    if(ui.pendingPhotos.length>=MAX_PHOTOS){alert('Maksimal '+MAX_PHOTOS+' foto per catatan.');break;}
    ui.pendingPhotos.push(await compress(f));
  }
  $('fotoPrev').innerHTML=ui.pendingPhotos.map(p=>`<img src="${p}" alt="">`).join('');
}

function openLb(entryId,i){

function lbMove(d){

/* ---------- TONGGAK ---------- */
function tabTonggak(c){
  const age=ageMonths(c);
  const done=S.milestones[c.id]||{};
  return `<p class="muted">Centang saat si kecil sudah bisa melakukannya. Anak tumbuh dengan ritmenya sendiri, jadi ini hanya catatan kenangan.</p>`+

    <h3>${g.label} ${age>=g.from&&age<g.to+12?'<span class="badge">usia sekarang</span>':''}</h3>
    ${g.items.map((t,ii)=>{
      const key='m'+gi+'_'+ii,d=done[key];
      return `<label class="check"><input type="checkbox" ${d?'checked':''} onchange="toggleMilestone('${c.id}','${key}')">
        <span>${esc(t)}${d?` <small class="muted">· ${fmtDate(d)}</small>`:''}</span></label>`;
    }).join('')}

function toggleMilestone(cid,key){
  S.milestones[cid]=S.milestones[cid]||{};
  if(S.milestones[cid][key]){delete S.milestones[cid][key];}
  else{
    const v=prompt('Tanggal tercapai (YYYY-MM-DD)',toISO(new Date()));
    if(!v)return render();
    S.milestones[cid][key]=v;
  }
  save();render();
}

/* ---------- TUMBUH ---------- */
function tabTumbuh(c){
  const list=S.growth.filter(g=>g.childId===c.id).sort((a,b)=>a.date.localeCompare(b.date));
  const wPts=list.filter(g=>g.weight).map(g=>({x:new Date(g.date).getTime(),y:+g.weight}));
  const hPts=list.filter(g=>g.height).map(g=>({x:new Date(g.date).getTime(),y:+g.height}));
  return `<div class="card noprint">
    <h3>Catat pengukuran</h3>
    <label>Tanggal</label><input type="date" id="gDate" value="${toISO(new Date())}">
    <div class="row"><div><label>Berat (kg)</label><input type="number" step="0.1" id="gW"></div>
    <div><label>Tinggi (cm)</label><input type="number" step="0.1" id="gH"></div></div>
    <button class="primary" onclick="saveGrowth('${c.id}')">Simpan pengukuran</button>
  </div>
  <div class="card"><h3>Berat badan</h3>${lineChart(wPts,'kg','#d98b5f')}
    <h3>Tinggi badan</h3>${lineChart(hPts,'cm','#6f9f86')}</div>
  <div class="card"><h3>Riwayat</h3>
    ${list.length?`<table><tr><th>Tanggal</th><th>Berat</th><th>Tinggi</th><th></th></tr>
    ${list.slice().reverse().map(g=>`<tr><td>${fmtDate(g.date)}</td><td>${g.weight||'-'}</td><td>${g.height||'-'}</td>
      <td><button class="x noprint" onclick="delGrowth('${g.id}')">Hapus</button></td></tr>`).join('')}</table>`:'<p class="muted">Belum ada data.</p>'}
  </div>`;
}
function saveGrowth(cid){
  const w=$('gW').value,h=$('gH').value;
  if(!w&&!h)return alert('Isi berat atau tinggi.');
  S.growth.push({id:uid(),childId:cid,date:$('gDate').value||toISO(new Date()),weight:w,height:h});
  save();render();
}
function delGrowth(id){S.growth=S.growth.filter(g=>g.id!==id);save();render();}
function lineChart(pts,unit,color){
  if(!pts.length)return '<p class="muted">Belum ada data.</p>';
  const W=320,H=160,P=30;
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);
  const x0=Math.min(...xs),x1=Math.max(...xs);
  const y0=Math.min(...ys)*0.95,y1=Math.max(...ys)*1.05||1;
  const X=x=>x1===x0?W/2:P+(x-x0)/(x1-x0)*(W-2*P);
  const Y=y=>H-P-(y-y0)/((y1-y0)||1)*(H-2*P);
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" xmlns="http://www.w3.org/2000/svg">
    <polyline points="${pts.map(p=>X(p.x)+','+Y(p.y)).join(' ')}" fill="none" stroke="${color}" stroke-width="2.5"/>
    ${pts.map(p=>`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="4" fill="${color}"/>
      <text x="${X(p.x)}" y="${Y(p.y)-9}" text-anchor="middle" font-size="11" fill="#4a3b32">${p.y} ${unit}</text>`).join('')}
  </svg>`;
}

/* ---------- KENANGAN ---------- */
function tabKenangan(c){
  const items=[];
  S.entries.filter(e=>e.childId===c.id).forEach(e=>items.push({date:e.date,cid:c.id,eid:e.id,kind:e.type==='surat'?'surat':'catatan',text:e.text,photos:e.photos}));
  const names=[];
  MILESTONES.forEach((g,gi)=>g.items.forEach((t,ii)=>names.push({key:'m'+gi+'_'+ii,label:t})));
  Object.entries(S.milestones[c.id]||{}).forEach(([k,d])=>{
    const m=names.find(x=>x.key===k);
    if(m)items.push({date:d,cid:c.id,eid:null,kind:'tonggak',text:m.label,photos:[]});
  });
  items.sort((a,b)=>b.date.localeCompare(a.date));
  const entryCount=items.filter(i=>i.kind!=='tonggak').length;
  const tCount=items.filter(i=>i.kind==='tonggak').length;
  return `<div class="card hero">
      <p>Ada <strong>${entryCount}</strong> kenangan dan <strong>${tCount}</strong> tonggak tercapai untuk ${esc(c.name)} sejauh ini.</p>
      <div class="quote">Setiap halaman ini adalah jejak tumbuhnya ${esc(c.name)}, tersimpan untuk dibaca kembali kelak.</div>
    </div>
    ${kenanganBox('Kenangan '+c.name,items,false,c)}
    <button class="ghost noprint" onclick="window.print()">Cetak kenangan</button>`;
}

/* ---------- KOTAK KENANGAN (dipakai untuk keluarga dan per anak) ---------- */
function kenanganBox(title,items,showChild,child){
  if(!items.length)return `<div class="card"><h2>${esc(title)}</h2><p class="muted">Kenangan akan muncul di sini seiring waktu.</p></div>`;
  let lastMonth='',out='';
  items.forEach(it=>{
    const [y,mo]=it.date.split('-');
    const key=y+'-'+mo;
    if(key!==lastMonth){
      const label=new Date(+y,+mo-1,1).toLocaleDateString('id-ID',{month:'long',year:'numeric'});
      out+=`<div class="year">${esc(label)}</div>`;
      lastMonth=key;
    }
    const day=new Date(it.date+'T00:00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    const icon=it.kind==='tonggak'?'🌟':it.kind==='surat'?'✉️':'📝';
    let age='';
    if(child){const m=monthsBetween(birthDate(child),new Date(it.date+'T00:00:00'));if(m>=0)age=` · usia ${m} bulan`;}
    const who=showChild?`<strong>${esc(childName(it.cid))}</strong> · `:'';
    const thumbs=it.photos.length?`<div class="pgrid">${it.photos.slice(0,4).map((p,i)=>`<img src="${src(p)}" alt="" onclick="openLb('${it.eid}',${i})">`).join('')}</div>`:'';
    out+=`<div class="tl">${who}<span class="tgl">${esc(day)}${age}</span><br>${icon} ${esc(it.text).replace(/\n/g,'<br>')}${thumbs}</div>`;
  });
  return `<div class="card"><h2>${esc(title)}</h2>
    <p class="muted" style="font-size:.85rem;margin-top:-4px">${items.length} kenangan · gulir untuk melihat semua</p>
    <div class="kk-scroll">${out}</div></div>`;
}

/* ---------- KENANGAN KELUARGA (gabungan semua anak) ---------- */
function viewKenanganKeluarga(){
  if(!S.children.length)return '';
  const names=[];
  MILESTONES.forEach((g,gi)=>g.items.forEach((t,ii)=>names.push({key:'m'+gi+'_'+ii,label:t})));
  const items=[];
  S.entries.forEach(e=>items.push({date:e.date,cid:e.childId,eid:e.id,kind:e.type==='surat'?'surat':'catatan',text:e.text,photos:e.photos}));
  S.children.forEach(c=>Object.entries(S.milestones[c.id]||{}).forEach(([k,d])=>{
    const m=names.find(x=>x.key===k);
    if(m)items.push({date:d,cid:c.id,eid:null,kind:'tonggak',text:m.label,photos:[]});
  }));
  items.sort((a,b)=>b.date.localeCompare(a.date));
  if(!items.length)return `<div class="card"><h2>Kenangan Keluarga</h2><p class="muted">Kenangan dari semua anak akan terkumpul di sini.</p></div>`;
  return kenanganBox('Kenangan Keluarga',items,true,null);
}

/* ---------- TEMA ---------- */
const PLANETS=[
 {r:90,s:6,t:30,c:'#c9b8a3'},
 {r:130,s:9,t:45,c:'#f0d9a8'},
 {r:175,s:10,t:60,c:'#5ba4e6'},
 {r:220,s:8,t:90,c:'#e8775a'},
 {r:270,s:16,t:130,c:'#e9c48b'}
];
function applyTheme(){
  document.body.classList.toggle('dark',localStorage.getItem('jurnal-tema')==='gelap');
}
function toggleTheme(){
  const gelap=!document.body.classList.contains('dark');
  localStorage.setItem('jurnal-tema',gelap?'gelap':'terang');
  applyTheme();render();
}
function buildSpace(){
  const box=$('space');
  if(box.childElementCount)return;
  let html='';
  for(let i=0;i<120;i++){
    const s=(Math.random()*2+1).toFixed(1);
    html+=`<span class="star" style="left:${(Math.random()*100).toFixed(2)}%;top:${(Math.random()*100).toFixed(2)}%;width:${s}px;height:${s}px;--d:${(2+Math.random()*3).toFixed(1)}s;--dl:${(Math.random()*4).toFixed(1)}s"></span>`;
  }
  html+='<div class="sys"><div class="sun"></div>'+PLANETS.map(p=>`<div class="orbit" style="--r:${p.r*2}px;--t:${p.t}s"><div class="planet" style="--ps:${p.s}px;--c:${p.c}"></div></div>`).join('')+'</div>';
  box.innerHTML=html;
}

/* ---------- LATAR MODE TERANG ---------- */
function buildScene(){
  const box=$('scene');
  if(box.childElementCount)return;
  const rnd=(a,b)=>a+Math.random()*(b-a);
  const cols=['#e07a3f','#d9a441','#8fb35a','#c8643b','#a7c35d','#e8b66a'];
  let leaves='';
  for(let i=0;i<26;i++){
    const w=rnd(10,18).toFixed(0),h=(w*0.6).toFixed(0);
    leaves+=`<div class="leaf" style="left:${rnd(0,100).toFixed(1)}%;width:${w}px;height:${h}px;background:${cols[i%cols.length]};--d:${rnd(9,18).toFixed(1)}s;--dl:${rnd(0,14).toFixed(1)}s"></div>`;
  }
  // pepohonan di atas bukit belakang
  const trees=[[60,104],[150,112],[240,98],[330,108],[430,96],[520,104],[640,92],[740,106],[840,96],[930,110],[1030,100],[1120,108]];
  let treeSvg='';
  trees.forEach(([x,y],i)=>{
    const h=rnd(38,58),trunk=h*0.35,rx=h*0.3,ry=h*0.42;
    const tone=i%2?'#6fa77c':'#8dbf93';
    treeSvg+=`<rect x="${x-3}" y="${(y-trunk).toFixed(1)}" width="6" height="${trunk.toFixed(1)}" fill="#7a5c43"/>
      <ellipse cx="${x}" cy="${(y-trunk-ry*0.6).toFixed(1)}" rx="${rx.toFixed(1)}" ry="${ry.toFixed(1)}" fill="${tone}"/>`;
  });
  // padang ilalang di bukit depan
  let blades='';
  for(let i=0;i<70;i++){
    const x=rnd(0,1200),base=rnd(262,300),hgt=rnd(30,80),lean=rnd(-10,10);
    const style=`--s:${rnd(3,6).toFixed(1)}s;--sl:${rnd(0,3).toFixed(1)}s`;
    blades+=`<path class="blade" d="M${x.toFixed(0)},${base.toFixed(0)} Q${(x+lean*0.3).toFixed(0)},${(base-hgt*0.6).toFixed(0)} ${(x+lean).toFixed(0)},${(base-hgt).toFixed(0)}" stroke="#d8c184" stroke-width="${rnd(1.4,2.4).toFixed(1)}" fill="none" stroke-linecap="round" style="${style}"/>`;
    if(i%3===0)blades+=`<ellipse class="blade" cx="${(x+lean).toFixed(0)}" cy="${(base-hgt-3).toFixed(0)}" rx="2.5" ry="6" fill="#f3e6bf" style="${style}"/>`;
  }
  const svg=`<svg class="hills" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,110 C200,80 380,100 560,95 C760,88 960,105 1200,92 L1200,300 L0,300 Z" fill="#cfe6d2"/>
    ${treeSvg}
    <path d="M0,210 C250,170 450,220 650,195 C850,170 1000,215 1200,190 L1200,300 L0,300 Z" fill="#b5d9a0"/>
    ${blades}
  </svg>`;
  box.innerHTML=leaves+svg;
}
